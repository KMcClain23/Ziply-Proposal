<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ziply Proposal Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="ziply-logo.png" alt="Ziply Logo" class="logo" />
      <img id="clientLogo" alt="Client Logo" class="logo right" />
    </div>

    <form id="proposalForm">
      <label>Business Name: <input type="text" id="businessName" required></label>
      <label>Contact Email: <input type="email" id="email"></label>
      <label>Required Services:</label>
      <div id="services-options">
        <label><input type="checkbox" name="service" value="Internet - 500Mbps"> Internet - 500Mbps</label>
        <label><input type="checkbox" name="service" value="Internet - 1Gbps"> Internet - 1Gbps</label>
        <label><input type="checkbox" name="service" value="Hosted Voice - Basic"> Hosted Voice - Basic</label>
        <label><input type="checkbox" name="service" value="Hosted Voice - Premium"> Hosted Voice - Premium</label>
      </div>
      <label>Additional Notes: <textarea id="notes"></textarea></label>
      <button type="submit">Generate Proposal</button>
    </form>

    <div id="proposalOutput" class="proposal-output hidden">
      <!-- Proposal Preview Goes Here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
