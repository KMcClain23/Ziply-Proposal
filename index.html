<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ziply Proposal Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Add any other global styles or Tailwind component base styles here if needed */
    .proposal-output h1, .proposal-output h2, .proposal-output h3 { color: inherit; } /* Reset for Tailwind */

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="ziply-logo.png" alt="Ziply Logo" class="logo" />
      <img id="clientLogo" alt="Client Logo" class="logo right" />
    </div>

    <form id="proposalForm">
      <label>Business Name: <input type="text" id="businessName" required class="border border-gray-300 rounded p-2"></label>
      <label>Contact Email (Client): <input type="email" id="clientContactEmail" class="border border-gray-300 rounded p-2"></label>
      <label>Contact Person Name (Client): <input type="text" id="clientContactPerson" class="border border-gray-300 rounded p-2"></label>
      <hr class="my-4"> <!-- Visual separator -->
      <h3 class="text-lg font-semibold mt-4 mb-2">Account Executive Details:</h3>
      <label>Your Name (Account Exec): <input type="text" id="accountExecName" required class="border border-gray-300 rounded p-2"></label>
      <label>Your Email (Account Exec): <input type="email" id="accountExecEmail" readonly class="border border-gray-300 rounded p-2 bg-gray-100"></label>
      <label>Your Title (Account Exec): <input type="text" id="accountExecTitle" value="Mid-Market Account Executive" readonly class="border border-gray-300 rounded p-2 bg-gray-100"></label>
      <hr class="my-4"> <!-- Visual separator -->
      <label>Required Services:</label>
      <div id="services-options">
        <label><input type="checkbox" name="service" value="Internet - 500Mbps" class="mr-2"> Internet - 500Mbps</label>
        <label><input type="checkbox" name="service" value="Internet - 1Gbps" class="mr-2"> Internet - 1Gbps</label>
        <label><input type="checkbox" name="service" value="Hosted Voice - Basic" class="mr-2"> Hosted Voice - Basic</label>
        <label><input type="checkbox" name="service" value="Hosted Voice - Premium" class="mr-2"> Hosted Voice - Premium</label>
      </div>
      <label>Additional Notes: <textarea id="notes" class="border border-gray-300 rounded p-2"></textarea></label>
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Generate Proposal</button>
    </form>

    <div id="proposalOutput" class="proposal-output hidden">
      <!-- Proposal Preview Goes Here -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
